apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: flowmint
spec:
  selector:
    app: flowmint
    component: postgres
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: flowmint
spec:
  selector:
    app: flowmint
    component: backend
  ports:
    - port: 8000
      targetPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: flowmint
spec:
  selector:
    app: flowmint
    component: frontend
  ports:
    - port: 80
      targetPort: 80
